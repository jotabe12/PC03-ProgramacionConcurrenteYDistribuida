# Proxy inverso (capa 7): única puerta de entrada al sistema.
#   /            -> SPA (archivos estáticos)
#   /api/        -> coordinador Go (API REST)
#   /ws          -> coordinador Go (WebSocket, Upgrade)
#   /swagger*    -> documentación de la API
# El puerto de MongoDB/Redis no pasa por aquí: esas bases viven en una red interna sin puertos publicados.

limit_req_zone $binary_remote_addr zone=api_por_ip:10m rate=300r/s;
limit_req_zone $binary_remote_addr zone=login_por_ip:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream coordinador {
    server coordinator:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # El coordinador también envía estas cabeceras (por si se le llama sin proxy);
    # se ocultan las suyas para que el cliente reciba una sola copia, la de nginx.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    location = /api/v1/auth/login {
        limit_req zone=login_por_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Connection "";
        proxy_pass http://coordinador;
    }

    location /api/ {
        limit_req zone=api_por_ip burst=600 nodelay;
        limit_req_status 429;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_pass http://coordinador;
    }

    location = /ws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_pass http://coordinador;
    }

    location ~ ^/swagger {
        proxy_set_header Connection "";
        proxy_pass http://coordinador;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Arquitectura TB2 · Grupo 3</title>
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", system-ui, Arial, sans-serif; }
  svg text { font-family: "Segoe UI", system-ui, Arial, sans-serif; fill: #17212b; }
  .t { font-size: 19px; font-weight: 600; }
  .s { font-size: 14px; fill: #3d4955; }
  .x { font-size: 13px; fill: #5b6775; }
  .lab { font-size: 13px; font-weight: 600; fill: #14324d; }
  .net { font-size: 15px; font-weight: 600; }
</style></head>
<body>
<svg id="arq" xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14324d"/></marker>
  </defs>
  <text x="40" y="44" style="font-size:26px;font-weight:600">TB2 · Arquitectura de la solución (Docker Compose: 7 contenedores en 3 redes)</text>
  <text x="40" y="72" class="s">Caso 2: denuncias policiales SIDPOL + población INEI · Random Forest distribuido en Go · API REST + WebSocket · MongoDB + Redis · SPA React</text>

  <!-- Equipo del usuario -->
  <rect x="40" y="110" width="250" height="150" rx="12" fill="#f6f8fa" stroke="#7b8692" stroke-width="2"/>
  <text x="58" y="142" class="t">Navegador</text>
  <text x="58" y="168" class="s">SPA React (login, impacto,</text>
  <text x="58" y="188" class="s">patrullaje, predicción,</text>
  <text x="58" y="208" class="s">entrenamiento, evaluación,</text>
  <text x="58" y="228" class="s">clúster y logs)</text>
  <text x="58" y="250" class="x">Postman · PowerShell</text>

  <!-- Red frontend -->
  <rect x="320" y="96" width="1250" height="350" rx="14" fill="none" stroke="#1d6b4f" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="356" y="124" class="net" style="fill:#1d6b4f">red frontend (puente)</text>
  <rect x="370" y="140" width="330" height="135" rx="12" fill="#e9f5ef" stroke="#1d6b4f" stroke-width="2"/>
  <text x="388" y="170" class="t">web · nginx + SPA</text>
  <text x="388" y="195" class="s">Única puerta: 127.0.0.1:8080</text>
  <text x="388" y="215" class="s">/ → SPA · /api, /ws, /swagger → API</text>
  <text x="388" y="235" class="s">limit_req, cabeceras de seguridad, CSP</text>
  <text x="388" y="258" class="x">proxy inverso capa 7</text>

  <rect x="800" y="140" width="740" height="290" rx="12" fill="#e8f1fc" stroke="#2370cd" stroke-width="2"/>
  <text x="820" y="170" class="t">coordinator · API concentradora en Go (HTTP :8080, TCP :9090)</text>
  <text x="820" y="198" class="s">• REST: auth/login, predict, impacto, patrullaje, evaluacion, train, metrics, admin/logs</text>
  <text x="820" y="220" class="s">• Seguridad: JWT HS256 + PBKDF2, roles admin/analista, CORS con lista blanca, cuotas</text>
  <text x="820" y="242" class="s">• WebSocket RFC 6455 (hub pub/sub): training, prediction, metrics, logs</text>
  <text x="820" y="264" class="s">• Coordinador del clúster: fan-out/fan-in por TCP JSON, voto suave por árboles</text>
  <text x="820" y="286" class="s">• Evaluación temporal (2018-2025 → 2026), impacto con población INEI</text>
  <text x="820" y="308" class="s">• Persistencia asíncrona (canal + goroutine), caché versionada con TTL</text>
  <text x="820" y="330" class="s">• Reentrena a un nodo que vuelve; AUTO_TRAIN al arrancar</text>
  <text x="820" y="358" class="x">Carga el CSV con el pipeline concurrente (lector → Worker Pool → recolector)</text>
  <text x="820" y="378" class="x">IP fija en la red datos (172.29.20.10): la única que MongoDB acepta para tb2_app</text>
  <text x="820" y="410" class="lab">Única pieza conectada a las tres redes</text>

  <!-- Red cluster -->
  <rect x="40" y="500" width="900" height="300" rx="14" fill="none" stroke="#b25c00" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="56" y="526" class="net" style="fill:#b25c00">red cluster (interna: sin salida ni puertos publicados)</text>
  <g>
    <rect x="70" y="550" width="270" height="225" rx="12" fill="#fff4e8" stroke="#d07a1e" stroke-width="2"/>
    <text x="88" y="580" class="t">ml-node-1</text>
    <text x="88" y="606" class="s">Carga concurrente del CSV</text>
    <text x="88" y="628" class="s">Shard: denuncia k → k mod N</text>
    <text x="88" y="650" class="s">Patrón de 12 meses previos</text>
    <text x="88" y="672" class="s">Worker Pool de goroutines:</text>
    <text x="88" y="694" class="s">un árbol CART por tarea</text>
    <text x="88" y="716" class="s">CPU/RSS desde /proc</text>
    <text x="88" y="752" class="x">progreso y logs → coordinador</text>
  </g>
  <g>
    <rect x="360" y="550" width="270" height="225" rx="12" fill="#fff4e8" stroke="#d07a1e" stroke-width="2"/>
    <text x="378" y="580" class="t">ml-node-2</text>
    <text x="378" y="606" class="s">Mismo binario y datos</text>
    <text x="378" y="628" class="s">Su bloque de árboles</text>
    <text x="378" y="650" class="s">(32 árboles = 11 + 11 + 10)</text>
    <text x="378" y="672" class="s">Predicción: probabilidades</text>
    <text x="378" y="694" class="s">de sus árboles</text>
    <text x="378" y="752" class="x">RWMutex: lecturas concurrentes</text>
  </g>
  <g>
    <rect x="650" y="550" width="270" height="225" rx="12" fill="#fff4e8" stroke="#d07a1e" stroke-width="2"/>
    <text x="668" y="580" class="t">ml-node-3</text>
    <text x="668" y="606" class="s">Reconexión con espera</text>
    <text x="668" y="628" class="s">exponencial</text>
    <text x="668" y="650" class="s">Respuestas tardías</text>
    <text x="668" y="672" class="s">descartadas por ID</text>
    <text x="668" y="752" class="x">topología estrella</text>
  </g>

  <!-- Red datos -->
  <rect x="980" y="500" width="580" height="300" rx="14" fill="none" stroke="#6a4ce2" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="996" y="526" class="net" style="fill:#6a4ce2">red datos (interna)</text>
  <rect x="1005" y="550" width="255" height="225" rx="12" fill="#f1edfd" stroke="#6a4ce2" stroke-width="2"/>
  <text x="1023" y="580" class="t">MongoDB 7</text>
  <text x="1023" y="606" class="s">Base tb2_denuncias:</text>
  <text x="1023" y="628" class="s">users, training_jobs,</text>
  <text x="1023" y="650" class="s">predictions, impact_reports,</text>
  <text x="1023" y="672" class="s">patrol_recommendations,</text>
  <text x="1023" y="694" class="s">cluster_metrics</text>
  <text x="1023" y="730" class="x">tb2_app: readWrite solo en su</text>
  <text x="1023" y="748" class="x">base y solo desde el coordinador</text>
  <rect x="1280" y="550" width="255" height="225" rx="12" fill="#f1edfd" stroke="#6a4ce2" stroke-width="2"/>
  <text x="1298" y="580" class="t">Redis 7</text>
  <text x="1298" y="606" class="s">Caché con TTL de 10 min:</text>
  <text x="1298" y="628" class="s">predicciones, impacto,</text>
  <text x="1298" y="650" class="s">patrullaje, modelo vigente</text>
  <text x="1298" y="672" class="s">(claves versionadas tb2:*)</text>
  <text x="1298" y="730" class="x">ACL: default deshabilitado;</text>
  <text x="1298" y="748" class="x">tb2app solo ~tb2:*, -@dangerous</text>

  <!-- Datos -->
  <rect x="40" y="840" width="900" height="130" rx="12" fill="#f6f8fa" stroke="#7b8692" stroke-width="2"/>
  <text x="58" y="870" class="t">Volumen ./data (solo lectura) montado en el coordinador y en los nodos</text>
  <text x="58" y="898" class="s">DATASET_Denuncias Policiales 2018-2026.csv: 376,715 filas agregadas → 1,987,556 denuncias de Lima y Callao</text>
  <text x="58" y="920" class="s">INEI: población proyectada 2018-2026 por distrito (XLSX leído con archive/zip + encoding/xml)</text>
  <text x="58" y="948" class="x">Entrenamiento 2018-2025 (1,823,335) · prueba 2026 (164,221) · validación 2025</text>

  <rect x="980" y="840" width="580" height="130" rx="12" fill="#fff" stroke="#c0302f" stroke-width="2"/>
  <text x="998" y="870" class="t" style="fill:#7d1d1c">Reglas de acceso (equivalente a una ACL)</text>
  <text x="998" y="896" class="s">permitir: equipo → web:80 (127.0.0.1:8080) · web → coordinator:8080</text>
  <text x="998" y="918" class="s">permitir: coordinator → nodos:9090 · coordinator → mongo/redis</text>
  <text x="998" y="940" class="s">denegar: nodos, web, LAN e internet → mongo/redis y nodos</text>
  <text x="998" y="960" class="x">sin "ports" en mongo, redis, coordinator ni nodos</text>

  <!-- Flechas -->
  <line x1="290" y1="190" x2="366" y2="200" stroke="#14324d" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="50" y="290" class="lab">HTTP y WebSocket</text>
  <text x="50" y="308" class="lab">a 127.0.0.1:8080</text>
  <line x1="700" y1="205" x2="796" y2="205" stroke="#14324d" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="712" y="196" class="lab">/api /ws</text>
  <line x1="880" y1="430" x2="880" y2="498" stroke="#14324d" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="430" y="472" class="lab">TCP JSON :9090 hacia los 3 nodos</text>
  <text x="430" y="490" class="x">TRAIN, PREDICT, PING / PROGRESS, LOG</text>
  <line x1="1200" y1="430" x2="1200" y2="546" stroke="#14324d" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1208" y="472" class="lab">:27017</text>
  <line x1="1407" y1="430" x2="1407" y2="546" stroke="#14324d" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1415" y="472" class="lab">:6379</text>
</svg>
</body></html>
